<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>专注力训练系统</title>
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body class="kids-bg">
  <header class="kids-header">
    <div class="header-inner">
      <h1>小小超能力训练营</h1>
      <nav>
        <a href="/trainings">训练项目</a>
        <a href="/reports/daily">每日成果</a>
      </nav>
    </div>
  </header>

  <section class="banner">
    <div class="mascot" aria-label="cute mascot"></div>
    <div class="banner-text">
      <h2>今天一起练习专注力吧！</h2>
      <p>日期：<span class="pill">{{.Today}}</span></p>
      <p>今日累计：<span class="pill accent">{{.TotalMin}} 分钟</span></p>
      <p class="sub">选择一个喜欢的项目，开始成为“专注小超人”～</p>
    </div>
  </section>

  <section>
    <h2 class="section-title">训练项目</h2>
    <div class="grid cards">
      {{range .Trainings}}
      <div class="card kids-card">
        <div class="card-top">
          <div class="icon">⭐️</div>
          <h3 class="card-title">{{.Name}}</h3>
        </div>
        <p class="muted">类别：{{.Category}}</p>
        <p class="muted">建议时长：{{.Suggested}} 分钟</p>
        <div class="actions">
          <form action="/session/start" method="post">
            <input type="hidden" name="training_id" value="{{.ID}}" />
            <button type="submit" class="cta">开始训练</button>
          </form>
          <a class="link" href="/training?id={{.ID}}">了解详情</a>
        </div>
      </div>
      {{end}}
    </div>
  </section>
</body>
</html>
