<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>平衡超人 - {{.TrainingName}}</title>
  <link rel="stylesheet" href="/static/app.css" />
  <style>
    .hero { display:flex; align-items:center; justify-content:center; margin-top: 1rem; }
    .kid { width: 160px; height: 220px; background: linear-gradient(#ffe0e0,#fff); border: 3px solid #ff8aa0; border-radius: 16px; position: relative; }
    .kid::before { content:""; position:absolute; left:50%; top:20%; width:60px; height:60px; margin-left:-30px; border-radius:50%; background:#ffd36b; border:2px solid #f2ae2e; }
    .kid::after { content:""; position:absolute; left:50%; top:52%; width:90px; height:90px; margin-left:-45px; border-radius:12px; background:#8ad4ff; border:2px solid #4ab3e2; }
    .stage { text-align:center; }
    .big { font-size: 2rem; font-weight: 800; color: #e24a68; }
    .btns { display:flex; gap: 12px; justify-content:center; margin-top: 1rem; }
    .round { font-size:1.2rem; color:#555; }
  </style>
  <script>
    let sessionId = {{.ID}};
    let side = 'left';
    let round = 1;
    let seconds = 30; // each round seconds
    let countdown = seconds;
    let timer;
    let success=0, errors=0;

    function updateUI(){
      document.getElementById('side').textContent = (side==='left'?'左脚':'右脚');
      document.getElementById('round').textContent = '第 '+round+' 轮';
      document.getElementById('count').textContent = countdown+' 秒';
      document.getElementById('succ').textContent = success;
      document.getElementById('err').textContent = errors;
    }
    function postProgress(){
      const form = new URLSearchParams();
      form.set('id', sessionId);
      form.set('success', success);
      form.set('errors', errors);
      fetch('/api/session/update', {method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body: form});
    }
    function nextRound(){
      side = (side==='left')?'right':'left';
      round++;
      countdown = seconds;
      updateUI();
    }
    function startTimer(){
      clearInterval(timer);
      countdown = seconds;
      timer = setInterval(()=>{
        countdown--; updateUI();
        if(countdown<=0){ clearInterval(timer); document.getElementById('doneSound').play(); }
      },1000);
    }
    function markSuccess(){ success++; postProgress(); nextRound(); startTimer(); }
    function markError(){ errors++; postProgress(); nextRound(); startTimer(); }
    document.addEventListener('DOMContentLoaded', ()=>{ updateUI(); startTimer(); });
  </script>
</head>
<body>
  <header>
    <h1>平衡超人</h1>
    <nav>
      <a href="/">首页</a>
    </nav>
  </header>
  <section class="stage">
    <p class="round" id="round">第 1 轮</p>
    <p class="big">请用 <span id="side">左脚</span> 独立站立</p>
    <p>倒计时：<strong id="count">30 秒</strong></p>
    <div class="hero"><div class="kid" aria-label="cartoon kid"></div></div>
    <div class="btns">
      <button onclick="markSuccess()">完成</button>
      <button onclick="markError()" style="background:#e24a68">失败</button>
      <form action="/session/finish" method="post" style="display:inline">
        <input type="hidden" name="id" value="{{.ID}}" />
        <button type="submit" style="background:#4ab3e2">结束训练</button>
      </form>
    </div>
    <p>完成次数：<strong id="succ">0</strong>，错误次数：<strong id="err">0</strong></p>
  </section>
  <audio id="doneSound"><source src="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAESsAACJWAAACABAAZGF0YQgAAAA=" type="audio/wav"></audio>
</body>
</html>
