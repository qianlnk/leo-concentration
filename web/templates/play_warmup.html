<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>全身唤醒 - {{.TrainingName}}</title>
  <link rel="stylesheet" href="/static/app.css" />
  <style>
    .stage { text-align:center; }
    .big { font-size: 2rem; font-weight: 800; color: #e24a68; }
    .counter { font-size: 2rem; font-weight: 900; color:#49c36b; margin: 0.5rem 0; }
    .energy { width: 180px; height: 180px; margin: 0 auto; border-radius: 50%; background: radial-gradient(circle at 50% 50%, #fff4d6 0%, #ffd36b 60%, #ffa447 100%); border: 6px solid #ff8aa0; box-shadow: 0 0 20px rgba(255, 212, 100, 0.6); transition: transform 0.1s ease; }
    .btns { display:flex; gap: 12px; justify-content:center; margin-top: 1rem; }
    .note { color:#666; }
  </style>
  <script>
    let sessionId = {{.ID}};
    let success = 0; // 完成的组数
    let errors = 0;  // 休息/中断次数
    let setStartTs = 0;
    let timerId;
    function updateCounts(){ document.getElementById('succ').textContent = success; document.getElementById('err').textContent = errors; }
    function updateTimer(){ const secs = setStartTs ? Math.floor((Date.now()-setStartTs)/1000) : 0; document.getElementById('elapsed').textContent = secs+' 秒'; }
    function startSet(){ setStartTs = Date.now(); updateTimer(); clearInterval(timerId); timerId = setInterval(updateTimer, 500); document.getElementById('msg').textContent=''; pulse(); }
    function completeSet(){ if(!setStartTs){ return } const secs = Math.floor((Date.now()-setStartTs)/1000); success++; updateCounts(); postProgress();
      const note = `全身唤醒 开合跳 一组 用时 ${secs}s`;
      const form = new URLSearchParams(); form.set('id', sessionId); form.set('success', success); form.set('errors', errors); form.set('notes', note); form.set('append','1');
      fetch('/api/session/update', {method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body: form});
      clearInterval(timerId); setStartTs = 0; updateTimer(); document.getElementById('msg').textContent = '已完成一组，用时 '+secs+' 秒'; pulse(); }
    function rest(){ errors++; updateCounts(); postProgress(); flash(); }
    function postProgress(){ const form = new URLSearchParams(); form.set('id', sessionId); form.set('success', success); form.set('errors', errors); fetch('/api/session/update', {method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body: form}); }
    function pulse(){ const el = document.querySelector('.energy'); el.style.transform='scale(1.05)'; setTimeout(()=>{ el.style.transform='scale(1)'; }, 120); }
    function flash(){ const el = document.querySelector('.energy'); el.style.filter='hue-rotate(40deg)'; setTimeout(()=>{ el.style.filter='none'; }, 200); }
    document.addEventListener('DOMContentLoaded', ()=>{ updateCounts(); updateTimer(); });
  </script>
</head>
<body>
  <header>
    <h1>全身唤醒</h1>
    <nav>
      <a href="/">首页</a>
    </nav>
  </header>
  <section class="stage">
    <p class="big">全身唤醒：做开合跳，让身体充满能量！</p>
    <p>当前一组计时：<strong id="elapsed">0 秒</strong></p>
    <div class="energy" aria-label="energy ball"></div>
    <p class="counter">已完成组数：<strong id="succ">0</strong> ｜ 休息次数：<strong id="err">0</strong></p>
    <div class="btns">
      <button onclick="startSet()">开始一组</button>
      <button onclick="completeSet()" class="cta">完成一组</button>
      <button onclick="rest()" style="background:#e24a68">休息一下</button>
      <form action="/session/finish" method="post" style="display:inline">
        <input type="hidden" name="id" value="{{.ID}}" />
        <button type="submit" style="background:#4ab3e2">结束训练</button>
      </form>
    </div>
    <p id="msg" class="note"></p>
  </section>
</body>
</html>
