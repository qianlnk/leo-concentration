<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>测试 - 眼疾手快数据记录</title>
  <style>
    body { font-family: sans-serif; padding: 2rem; max-width: 800px; margin: 0 auto; }
    .log { background: #f5f5f5; padding: 1rem; border-radius: 8px; margin: 1rem 0; max-height: 400px; overflow-y: auto; }
    .log-item { padding: 0.5rem; border-bottom: 1px solid #ddd; font-size: 0.9rem; }
    .log-item.success { color: #28a745; }
    .log-item.error { color: #dc3545; }
    .log-item.info { color: #007bff; }
    button { padding: 0.75rem 1.5rem; margin: 0.5rem; font-size: 1rem; cursor: pointer; }
  </style>
</head>
<body>
  <h1>🧪 眼疾手快 - 数据记录测试</h1>
  <p>这个页面用于测试数据记录功能是否正常工作</p>

  <div>
    <button onclick="testCreateSession()">1. 创建会话</button>
    <button onclick="testStartRound()">2. 开始轮次</button>
    <button onclick="testFinishRound()">3. 结束轮次</button>
    <button onclick="clearLog()">清空日志</button>
  </div>

  <h2>📝 调用日志</h2>
  <div class="log" id="log"></div>

  <h2>📊 当前状态</h2>
  <pre id="status">
Session ID: 未创建
Round ID: 未开始
Round Number: 0
  </pre>

  <script>
    let sessionId = null;
    let roundId = null;
    let roundNumber = 0;

    function log(message, type = 'info') {
      const logDiv = document.getElementById('log');
      const item = document.createElement('div');
      item.className = `log-item ${type}`;
      item.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
      logDiv.insertBefore(item, logDiv.firstChild);
    }

    function updateStatus() {
      document.getElementById('status').textContent =
        `Session ID: ${sessionId || '未创建'}\n` +
        `Round ID: ${roundId || '未开始'}\n` +
        `Round Number: ${roundNumber}`;
    }

    function clearLog() {
      document.getElementById('log').innerHTML = '';
    }

    async function testCreateSession() {
      try {
        log('正在创建会话...', 'info');

        const response = await fetch('/session/start', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: 'training_id=11'
        });

        log(`响应状态: ${response.status}`, 'info');

        if (response.redirected) {
          const url = new URL(response.url);
          sessionId = url.searchParams.get('id');
          log(`✓ 会话创建成功！Session ID: ${sessionId}`, 'success');
          updateStatus();
        } else {
          log(`✗ 会话创建失败`, 'error');
        }
      } catch (err) {
        log(`✗ 错误: ${err.message}`, 'error');
      }
    }

    async function testStartRound() {
      if (!sessionId) {
        log('✗ 请先创建会话！', 'error');
        return;
      }

      try {
        roundNumber++;
        log(`正在开始第 ${roundNumber} 轮...`, 'info');

        const form = new URLSearchParams();
        form.set('session_id', sessionId);
        form.set('round_number', roundNumber);

        const response = await fetch('/api/session/round/start', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: form
        });

        log(`响应状态: ${response.status}`, 'info');

        const data = await response.json();
        log(`响应数据: ${JSON.stringify(data)}`, 'info');

        if (data.ok && data.round_id) {
          roundId = data.round_id;
          log(`✓ 轮次开始成功！Round ID: ${roundId}`, 'success');
          updateStatus();
        } else {
          log(`✗ 轮次开始失败`, 'error');
        }
      } catch (err) {
        log(`✗ 错误: ${err.message}`, 'error');
        console.error('详细错误:', err);
      }
    }

    async function testFinishRound() {
      if (!roundId) {
        log('✗ 请先开始轮次！', 'error');
        return;
      }

      try {
        log(`正在结束轮次 ${roundId}...`, 'info');

        const metadata = JSON.stringify({
          cups_count: 3,
          swaps_count: 4,
          level: 'easy',
          test: true
        });

        const form = new URLSearchParams();
        form.set('round_id', roundId);
        form.set('success', '1');
        form.set('score', '100');
        form.set('accuracy', '100');
        form.set('metadata', metadata);

        const response = await fetch('/api/session/round/finish', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: form
        });

        log(`响应状态: ${response.status}`, 'info');

        const data = await response.json();
        log(`响应数据: ${JSON.stringify(data)}`, 'info');

        if (data.ok) {
          log(`✓ 轮次结束成功！`, 'success');
          log(`现在可以去查看统计页面验证数据`, 'success');
          roundId = null;
          updateStatus();
        } else {
          log(`✗ 轮次结束失败`, 'error');
        }
      } catch (err) {
        log(`✗ 错误: ${err.message}`, 'error');
        console.error('详细错误:', err);
      }
    }

    // 初始化
    log('测试页面已加载', 'info');
    log('请按顺序点击按钮: 1→2→3', 'info');
  </script>
</body>
</html>
