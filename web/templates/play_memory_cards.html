<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>记忆卡片 - {{.TrainingName}}</title>
  <link rel="stylesheet" href="/static/app.css" />
  <style>
    .panel { text-align:center; }
    .big { font-size: 1.6rem; font-weight: 800; color: #4a90e2; }
    .board { display:grid; gap:10px; justify-content:center; margin-top:1rem; }
    .card { width:90px; height:110px; border-radius:12px; background:#ffeef2; border:3px solid #ff8aa0; display:flex; align-items:center; justify-content:center; font-size:2rem; cursor:pointer; transform: scale(1); transition: transform .08s ease, background .2s ease; box-sizing: border-box; }
    .card:hover { transform: scale(1.03); }
    .card.flipped { background:#fff9d6; border-color:#ffd36b; }
    .card.matched { background:#c8f7c5; border-color:#49c36b; cursor:default; }
    .stats { margin-top: 6px; color:#555; }
    .controls { display:flex; gap:8px; justify-content:center; align-items:center; margin-top:10px; }
  </style>
  <script>
    let sessionId = {{.ID}};
    let rows = 4, cols = 4; // 默认 4x4 8 对
    let startTs = 0;
    let successPairs = 0;
    let errors = 0;
    let first = null, second = null;
    let isChecking = false; // 添加锁定状态，防止快速点击导致状态混乱
    let flipBackTimer = null; // 保存延迟翻回的定时器，用于快速点击时取消
    const icons = ['🍎','⭐','🚗','🐣','🌈','🎈','🧩','⚽','🎵','🔔','🍇','🦄'];

    function gridSize(){ return rows*cols; }
    function build(){
      // 初始化牌堆
      const pairCount = gridSize()/2;
      const deck = [];
      for(let i=0;i<pairCount;i++){ deck.push(icons[i%icons.length]); deck.push(icons[i%icons.length]); }
      shuffle(deck);
      const board = document.getElementById('board');
      board.innerHTML='';
      board.style.gridTemplateColumns = `repeat(${cols}, 90px)`;
      deck.forEach((icon, idx)=>{
        const d = document.createElement('div'); d.className='card'; d.dataset.icon = icon; d.dataset.idx = idx;
        d.onclick = ()=> clickCard(d);
        d.textContent = '❓';
        board.appendChild(d);
      });
      // 重置状态与计时
      successPairs = 0; errors = 0; first=null; second=null; isChecking=false; flipBackTimer=null; updatePanel(); startTimer();
    }
    function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]] } }
    function startTimer(){ startTs = Date.now(); tick(); clearInterval(window._t); window._t = setInterval(tick, 500); }
    function tick(){ const secs = Math.floor((Date.now()-startTs)/1000); document.getElementById('elapsed').textContent = secs+' 秒'; }
    function updatePanel(){ document.getElementById('succ').textContent = successPairs; document.getElementById('err').textContent = errors; }
    function postProgress(){ const form = new URLSearchParams(); form.set('id', sessionId); form.set('success', successPairs); form.set('errors', errors); fetch('/api/session/update', {method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body: form}); }
    function clickCard(el){
      // 如果卡片已配对或已是当前翻开的卡片，则忽略
      if(el.classList.contains('matched') || el===first || el===second) return;

      // 如果正在检查中（两张卡片不匹配等待翻回），立即强制翻回它们
      if(isChecking){
        clearTimeout(flipBackTimer); // 取消延迟翻回
        if(first){ first.classList.remove('flipped'); first.textContent='❓'; }
        if(second){ second.classList.remove('flipped'); second.textContent='❓'; }
        first = null; second = null;
        isChecking = false;
      }

      // 正常处理当前点击
      el.classList.add('flipped'); el.textContent = el.dataset.icon;
      if(!first){ first = el; return; }
      if(!second){ second = el; isChecking = true; checkPair(); return; }
    }
    function checkPair(){
      const a = first.dataset.icon, b = second.dataset.icon;
      if(a===b){
        // 配对成功
        first.classList.add('matched'); second.classList.add('matched');
        successPairs++; postProgress(); updatePanel();
        first = null; second = null;
        isChecking = false; // 解除锁定
        if(successPairs === gridSize()/2){ finish(); }
      } else {
        // 配对失败，延迟翻回
        errors++; postProgress(); updatePanel();
        flipBackTimer = setTimeout(()=>{
          first.classList.remove('flipped'); first.textContent='❓';
          second.classList.remove('flipped'); second.textContent='❓';
          first = null; second = null;
          isChecking = false; // 延迟后解除锁定
          flipBackTimer = null;
        }, 650);
      }
    }
    function finish(){
      clearInterval(window._t);
      const secs = Math.floor((Date.now()-startTs)/1000);
      document.getElementById('msg').textContent = '太棒了！全部配对完成，用时 '+secs+' 秒';
      const note = `记忆卡片 ${rows}x${cols} 用时 ${secs}s`;
      const form = new URLSearchParams(); form.set('id', sessionId); form.set('success', successPairs); form.set('errors', errors); form.set('notes', note); form.set('append','1');
      fetch('/api/session/update', {method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body: form});
    }
    function setLevel(r,c){ rows=r; cols=c; build(); }
    document.addEventListener('DOMContentLoaded', ()=>{ build(); });
  </script>
</head>
<body>
  <header>
    <h1>记忆卡片</h1>
    <nav>
      <a href="/">首页</a>
    </nav>
  </header>
  <section class="panel">
    <p class="big">翻牌找出两张相同的卡片！</p>
    <p>计时：<strong id="elapsed">0 秒</strong> ｜ 已配对：<strong id="succ">0</strong> 对 ｜ 错误：<strong id="err">0</strong></p>
    <div class="controls">
      <span>选择难度：</span>
      <button onclick="setLevel(3,4)">3×4</button>
      <button onclick="setLevel(4,4)">4×4</button>
      <button onclick="setLevel(4,5)">4×5</button>
    </div>
    <div id="board" class="board" aria-label="memory cards"></div>
    <div style="margin-top:1rem">
      <form action="/session/finish" method="post" style="display:inline">
        <input type="hidden" name="id" value="{{.ID}}" />
        <button type="submit" style="background:#4ab3e2">结束训练</button>
      </form>
    </div>
    <p id="msg" class="stats"></p>
  </section>
</body>
</html>
