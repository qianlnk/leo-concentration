<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>记忆卡片 - {{.TrainingName}}</title>
  <link rel="stylesheet" href="/static/app.css" />
  <style>
    /* Header优化 - 紧凑布局 */
    header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 10px 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    header h1 {
      font-size: 1.5rem;
      margin: 0;
      color: white;
      display: inline-block;
    }
    header nav {
      display: inline-block;
      float: right;
      margin-top: 5px;
    }
    header nav a {
      color: white;
      text-decoration: none;
      background: rgba(255,255,255,0.2);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.9rem;
      transition: all 0.3s;
    }
    header nav a:hover {
      background: rgba(255,255,255,0.3);
      transform: scale(1.05);
    }

    /* 信息栏 - 卡片式布局 */
    .info-bar {
      background: #f8f9fa;
      padding: 10px;
      border-radius: 12px;
      margin: 10px auto;
      max-width: 600px;
      display: flex;
      justify-content: space-around;
      flex-wrap: wrap;
      gap: 10px;
    }
    .info-item {
      display: inline-block;
    }
    .info-label {
      font-size: 0.85rem;
      color: #666;
      display: block;
    }
    .info-value {
      font-size: 1.3rem;
      font-weight: 700;
      color: #4a90e2;
    }
    .timer {
      font-size: 2rem;
      font-weight: 900;
      color: #e24a68;
    }

    /* 欢迎消息 */
    .welcome-msg {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 40px 20px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(102, 126, 234, 0.3);
      margin: 20px auto;
      max-width: 500px;
    }
    .welcome-msg h2 { font-size: 1.8rem; margin-bottom: 12px; }
    .welcome-msg p { font-size: 1.1rem; margin: 8px 0; opacity: 0.95; }
    .welcome-msg .icon { font-size: 3rem; margin-bottom: 12px; }

    /* 成功消息 */
    .success-msg {
      background: linear-gradient(135deg, #49c36b 0%, #3da85a 100%);
      color: white;
      padding: 40px 20px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(73, 195, 107, 0.3);
      margin: 20px auto;
      max-width: 500px;
      animation: successPop 0.5s ease;
    }
    .success-msg h2 { font-size: 2rem; margin-bottom: 12px; }
    .success-msg p { font-size: 1.2rem; margin: 8px 0; }
    .success-msg .icon { font-size: 4rem; margin-bottom: 12px; }
    @keyframes successPop {
      0% { transform: scale(0.8); opacity: 0; }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); opacity: 1; }
    }

    /* 控件美化 */
    .controls {
      display: flex;
      gap: 8px;
      justify-content: center;
      align-items: center;
      margin: 10px 0;
      flex-wrap: wrap;
    }
    .levelBtn {
      font-size: 0.95rem;
      padding: 8px 16px;
      border: 2px solid #4a90e2;
      border-radius: 8px;
      background: white;
      color: #333;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s;
    }
    .levelBtn:hover {
      border-color: #49c36b;
      background: #f0f9f4;
      transform: translateY(-2px);
    }
    .startBtn {
      font-size: 1rem;
      padding: 10px 24px;
      background: linear-gradient(135deg, #49c36b 0%, #3da85a 100%);
      color: white;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 4px 12px rgba(73, 195, 107, 0.3);
      transition: all 0.3s;
    }
    .startBtn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(73, 195, 107, 0.4);
    }
    .startBtn:disabled {
      background: #ccc;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
    .endBtn {
      font-size: 0.9rem;
      padding: 8px 20px;
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      color: white;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
      box-shadow: 0 3px 10px rgba(245, 87, 108, 0.3);
      transition: all 0.3s;
    }
    .endBtn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 14px rgba(245, 87, 108, 0.4);
    }

    .panel { text-align:center; padding-top: 15px; }
    .board {
      gap:10px;
      justify-content:center;
      margin:0.5rem auto;
      min-height: 300px;
      display: flex;
      align-items: center;
    }
    .card {
      width:70px;
      height:70px;
      border-radius:10px;
      background:#ffeef2;
      border:2px solid #ff8aa0;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:1.8rem;
      cursor:pointer;
      transform: scale(1);
      transition: transform .08s ease, background .2s ease;
      box-sizing: border-box;
    }
    .card:hover { transform: scale(1.05); box-shadow: 0 2px 8px rgba(255, 138, 160, 0.3); }
    .card.flipped { background:#fff9d6; border-color:#ffd36b; }
    .card.matched { background:#c8f7c5; border-color:#49c36b; cursor:default; }

    .levelSelector {
      font-size: 0.95rem;
      padding: 8px 12px;
      border: 2px solid #4a90e2;
      border-radius: 8px;
      background: white;
      color: #333;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s;
    }
    .levelSelector:hover {
      border-color: #49c36b;
      background: #f0f9f4;
    }
    .levelSelector:focus {
      outline: none;
      border-color: #49c36b;
      box-shadow: 0 0 0 3px rgba(73, 195, 107, 0.2);
    }
  </style>
  <script>
    let sessionId = {{.ID}};
    let rows = 4, cols = 4; // 默认 4×4
    let startTs = 0;
    let successPairs = 0;
    let errors = 0;
    let first = null, second = null;
    let isChecking = false;
    let flipBackTimer = null;
    let gameStarted = false; // 游戏是否已开始
    // 扩展图标库，支持最大 10×10 (50对)
    const icons = [
      '🍎','⭐','🚗','🐣','🌈','🎈','🧩','⚽','🎵','🔔',
      '🍇','🦄','🌸','🎨','🎭','🎪','🎯','🎲','🎰','🎳',
      '🍕','🍔','🍟','🍿','🍩','🍪','🍰','🧁','🍦','🍓',
      '🐶','🐱','🐭','🐹','🐰','🦊','🐻','🐼','🐨','🐯',
      '🚀','✈️','🚁','🚂','🚃','🚄','🚅','⛵','🚤','🛸'
    ];
    let roundNumber = 0;
    let currentRoundId = 0;
    let roundStartTime = 0;

    // 开始新轮次
    async function startRound() {
      roundNumber++;
      roundStartTime = Date.now();

      console.log('🔵 [记忆卡片] 开始新轮次', { sessionId, roundNumber, gridSize: `${rows}×${cols}` });
      try {
        const form = new URLSearchParams();
        form.set('session_id', sessionId);
        form.set('round_number', roundNumber);
        const response = await fetch('/api/session/round/start', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: form
        });
        const data = await response.json();
        currentRoundId = data.round_id;
        console.log('✅ [记忆卡片] 轮次开始成功', { roundId: currentRoundId });
      } catch (err) {
        console.error('❌ [记忆卡片] 开始轮次失败:', err);
      }
    }

    // 完成当前轮次
    async function finishRound(isSuccess) {
      if (!currentRoundId) {
        console.warn('⚠️ [记忆卡片] 没有currentRoundId，跳过轮次记录');
        return;
      }

      const duration = Math.floor((Date.now() - roundStartTime) / 1000);
      const totalPairs = (rows * cols) / 2;
      const accuracy = errors === 0 ? 100 : Math.round((successPairs / (successPairs + errors)) * 100);
      const score = isSuccess ? 100 : Math.round((successPairs / totalPairs) * 80);

      const metadata = JSON.stringify({
        grid_size: `${rows}×${cols}`,
        pairs_count: totalPairs,
        matched_pairs: successPairs,
        errors: errors,
        time_seconds: duration
      });

      console.log('🔵 [记忆卡片] 发送轮次完成请求', { roundId: currentRoundId, duration, isSuccess });
      try {
        const form = new URLSearchParams();
        form.set('round_id', currentRoundId);
        form.set('duration_seconds', duration);
        form.set('success', isSuccess ? '1' : '0');
        form.set('score', score);
        form.set('accuracy', accuracy);
        form.set('metadata', metadata);

        const response = await fetch('/api/session/round/finish', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: form
        });
        const data = await response.json();
        console.log('✅ [记忆卡片] 轮次记录完成', data);
      } catch (err) {
        console.error('❌ [记忆卡片] 记录轮次失败:', err);
      }
    }

    // 初始化UI（不开始游戏）
    function initUI(){
      const board = document.getElementById('board');
      board.style.display = 'flex';
      board.innerHTML = `
        <div class="welcome-msg">
          <div class="icon">🃏</div>
          <h2>记忆卡片训练</h2>
          <p>选择难度，找出所有相同的卡片</p>
          <p>锻炼你的记忆力和专注力！</p>
        </div>
      `;
      successPairs = 0;
      errors = 0;
      first = null;
      second = null;
      isChecking = false;
      flipBackTimer = null;
      updatePanel();
      document.getElementById('elapsed').textContent = '0 秒';
      document.getElementById('levelInfo').textContent = `${rows}×${cols}`;
      gameStarted = false;
      document.getElementById('startBtn').disabled = false;
      document.getElementById('startBtn').textContent = '🚀 开始训练';
      document.getElementById('levelSelector').disabled = false;
    }

    // 生成游戏内容（不调用API）
    function buildBoard(){
      const totalCards = rows * cols;
      const pairCount = totalCards / 2;
      const deck = [];

      // 检查图标是否足够
      if(pairCount > icons.length){
        alert(`图标库不足！当前最多支持 ${icons.length} 对卡片。`);
        return;
      }

      // 随机选择不重复的图标
      const selectedIcons = [...icons].sort(() => Math.random() - 0.5).slice(0, pairCount);

      // 生成配对卡片
      for(let i=0; i<pairCount; i++){
        deck.push(selectedIcons[i]);
        deck.push(selectedIcons[i]);
      }
      shuffle(deck);

      const board = document.getElementById('board');
      board.innerHTML='';
      // 改为 grid 布局
      board.style.display = 'grid';
      board.style.gridTemplateColumns = `repeat(${cols}, 70px)`;

      deck.forEach((icon, idx)=>{
        const d = document.createElement('div');
        d.className='card';
        d.dataset.icon = icon;
        d.dataset.idx = idx;
        d.onclick = ()=> clickCard(d);
        d.textContent = '❓';
        board.appendChild(d);
      });
    }

    // 开始游戏（调用API和计时）
    async function startGame(){
      if (gameStarted) return;
      gameStarted = true;

      // 禁用控件
      document.getElementById('startBtn').disabled = true;
      document.getElementById('levelSelector').disabled = true;

      // 生成卡片
      buildBoard();

      // 重置状态
      successPairs = 0;
      errors = 0;
      first = null;
      second = null;
      isChecking = false;
      flipBackTimer = null;
      updatePanel();

      // 开始计时
      startTimer();

      // 开始新轮次记录
      await startRound();
    }

    function shuffle(a){
      for(let i=a.length-1;i>0;i--){
        const j=Math.floor(Math.random()*(i+1));
        [a[i],a[j]]=[a[j],a[i]]
      }
    }

    function startTimer(){
      startTs = Date.now();
      tick();
      clearInterval(window._t);
      window._t = setInterval(tick, 500);
    }

    function tick(){
      const secs = Math.floor((Date.now()-startTs)/1000);
      document.getElementById('elapsed').textContent = secs+' 秒';
    }

    function updatePanel(){
      document.getElementById('succ').textContent = successPairs;
      document.getElementById('err').textContent = errors;
    }

    function clickCard(el){
      if(el.classList.contains('matched') || el===first || el===second) return;

      if(isChecking){
        clearTimeout(flipBackTimer);
        if(first){ first.classList.remove('flipped'); first.textContent='❓'; }
        if(second){ second.classList.remove('flipped'); second.textContent='❓'; }
        first = null; second = null;
        isChecking = false;
      }

      el.classList.add('flipped'); el.textContent = el.dataset.icon;
      if(!first){ first = el; return; }
      if(!second){ second = el; isChecking = true; checkPair(); return; }
    }

    function checkPair(){
      const a = first.dataset.icon, b = second.dataset.icon;
      if(a===b){
        first.classList.add('matched');
        second.classList.add('matched');
        successPairs++;
        updatePanel();
        first = null;
        second = null;
        isChecking = false;
        if(successPairs === (rows * cols)/2){ finish(); }
      } else {
        errors++;
        updatePanel();
        flipBackTimer = setTimeout(()=>{
          first.classList.remove('flipped'); first.textContent='❓';
          second.classList.remove('flipped'); second.textContent='❓';
          first = null; second = null;
          isChecking = false;
          flipBackTimer = null;
        }, 650);
      }
    }

    // 显示成功消息
    function showSuccessMessage(secs){
      const board = document.getElementById('board');
      const accuracy = errors === 0 ? 100 : Math.round((successPairs / (successPairs + errors)) * 100);
      board.style.display = 'flex';
      board.style.flexWrap = 'nowrap';
      board.innerHTML = `
        <div class="success-msg">
          <div class="icon">🎉</div>
          <h2>你真棒！</h2>
          <p>用时 ${secs} 秒</p>
          <p>准确率 ${accuracy}%</p>
          <p style="font-size: 0.9rem; opacity: 0.9;">正在准备下一轮...</p>
        </div>
      `;
    }

    async function finish(){
      clearInterval(window._t);
      const secs = Math.floor((Date.now()-startTs)/1000);
      await finishRound(true);

      // 显示成功消息
      showSuccessMessage(secs);

      // 2秒后自动重置
      setTimeout(()=>{
        initUI();
      }, 2000);
    }

    function changeLevel(){
      const selector = document.getElementById('levelSelector');
      const value = selector.value;
      const [r, c] = value.split('x').map(v => parseInt(v));
      rows = r;
      cols = c;
      document.getElementById('levelInfo').textContent = `${rows}×${cols}`;
      initUI();
    }

    document.addEventListener('DOMContentLoaded', ()=>{ initUI(); });
  </script>
</head>
<body>
  <header>
    <h1>🃏 记忆卡片</h1>
    <nav>
      <a href="/">返回首页</a>
    </nav>
  </header>
  <section class="panel">
    <!-- 信息栏 -->
    <div class="info-bar">
      <div class="info-item">
        <span class="info-label">难度</span>
        <span class="info-value" id="levelInfo">4×4</span>
      </div>
      <div class="info-item">
        <span class="info-label">计时</span>
        <span class="info-value timer" id="elapsed">0 秒</span>
      </div>
      <div class="info-item">
        <span class="info-label">已配对</span>
        <span class="info-value" style="color: #49c36b;" id="succ">0</span>
      </div>
      <div class="info-item">
        <span class="info-label">错误</span>
        <span class="info-value" style="color: #e24a68;" id="err">0</span>
      </div>
    </div>

    <!-- 控件区域 -->
    <div class="controls">
      <label for="levelSelector" style="font-weight: 600; color: #333; font-size: 1rem;">🎯 选择难度：</label>
      <select id="levelSelector" class="levelSelector" onchange="changeLevel()">
        <option value="3x4">3×4 (简单 - 6对)</option>
        <option value="4x4" selected>4×4 (普通 - 8对)</option>
        <option value="4x5">4×5 (中等 - 10对)</option>
        <option value="5x6">5×6 (困难 - 15对)</option>
        <option value="6x6">6×6 (很难 - 18对)</option>
        <option value="6x8">6×8 (专家 - 24对)</option>
        <option value="8x8">8×8 (大师 - 32对)</option>
        <option value="10x10">10×10 (传奇 - 50对)</option>
      </select>
    </div>
    <div>
      <button id="startBtn" class="startBtn" onclick="startGame()">🚀 开始训练</button>
    </div>

    <!-- 游戏区域 -->
    <div id="board" class="board" aria-label="memory cards"></div>

    <!-- 结束按钮 -->
    <div style="margin-top:1rem">
      <form action="/session/finish" method="post" style="display:inline">
        <input type="hidden" name="id" value="{{.ID}}" />
        <button type="submit" class="endBtn">结束训练</button>
      </form>
    </div>
  </section>
</body>
</html>
