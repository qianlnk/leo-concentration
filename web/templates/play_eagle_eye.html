<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>火眼金睛 - {{.TrainingName}}</title>
  <link rel="stylesheet" href="/static/app.css" />
  <style>
    /* Header优化 - 紧凑布局 */
    header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 10px 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    header h1 {
      font-size: 1.5rem;
      margin: 0;
      color: white;
      display: inline-block;
    }
    header nav {
      display: inline-block;
      float: right;
      margin-top: 5px;
    }
    header nav a {
      color: white;
      text-decoration: none;
      background: rgba(255,255,255,0.2);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.9rem;
      transition: all 0.3s;
    }
    header nav a:hover {
      background: rgba(255,255,255,0.3);
      transform: scale(1.05);
    }

    .panel { text-align:center; padding: 1rem; }
    .big { font-size: 1.6rem; font-weight: 800; color: #ff6b35; margin-bottom: 0.5rem; }
    .instruction { color: #666; margin-bottom: 1rem; font-size: 0.95rem; }

    /* 信息栏样式 - 统一样式 */
    .info-bar { background: #f8f9fa; padding: 10px; border-radius: 12px; margin: 10px auto; max-width: 600px; display: flex; justify-content: space-around; flex-wrap: wrap; gap: 10px; }
    .info-item { display: inline-block; }
    .info-label { font-size: 0.85rem; color: #666; display: block; }
    .info-value { font-size: 1.3rem; font-weight: 700; color: #4a90e2; }
    .timer { font-size: 2rem; font-weight: 900; color: #e24a68; }

    .controls { display:flex; gap:8px; justify-content:center; align-items:center; margin: 1rem 0; flex-wrap: wrap; }

    /* 任务提示区域 - 精简版 */
    .task-prompt {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 0.8rem 1.2rem;
      border-radius: 12px;
      margin: 1rem auto;
      max-width: 600px;
      box-shadow: 0 4px 20px rgba(102, 126, 234, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
    }
    .task-prompt .target {
      font-size: 2rem;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
    }
    .task-prompt .info {
      font-size: 1.1rem;
      font-weight: 600;
    }

    /* 物品容器 - 随机散布 */
    .items-container {
      position: relative;
      width: 90%;
      max-width: 1000px;
      height: 600px;
      margin: 1.5rem auto;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      border-radius: 20px;
      overflow: hidden;
    }
    .item-cell {
      position: absolute;
      font-size: 2.5rem;
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
      filter: drop-shadow(2px 2px 3px rgba(0,0,0,0.1));
    }
    .item-cell:hover {
      transform: scale(1.2);
      filter: drop-shadow(3px 3px 6px rgba(0,0,0,0.2));
    }
    .item-cell.found {
      animation: foundAnim 0.4s ease;
      opacity: 0.3;
      pointer-events: none;
    }
    .item-cell.wrong {
      animation: wrongShake 0.3s ease;
    }
    @keyframes foundAnim {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.4) rotate(15deg); }
    }
    @keyframes wrongShake {
      0%, 100% { transform: translateX(0) rotate(0deg); }
      25% { transform: translateX(-10px) rotate(-5deg); }
      75% { transform: translateX(10px) rotate(5deg); }
    }

    /* 消息提示 */
    #msg {
      margin-top: 1rem;
      font-size: 1.3rem;
      font-weight: 600;
      color: #28a745;
      min-height: 1.5rem;
    }
    #msg.error {
      color: #dc3545;
    }

    /* 难度选择器 */
    .levelSelector {
      padding: 0.5rem 1rem;
      border-radius: 8px;
      border: 2px solid #667eea;
      background: white;
      color: #667eea;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .levelSelector:hover {
      border-color: #764ba2;
      box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
    }

    /* 开始按钮 */
    .start-btn {
      padding: 0.8rem 2rem;
      font-size: 1.1rem;
      font-weight: 600;
      border-radius: 10px;
      border: none;
      background: #28a745;
      color: white;
      cursor: pointer;
      transition: all 0.2s ease;
      margin: 1rem 0;
    }
    .start-btn:hover:not(:disabled) {
      background: #218838;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(40, 167, 69, 0.3);
    }
    .start-btn:disabled {
      background: #6c757d;
      cursor: not-allowed;
      opacity: 0.6;
    }

    /* 欢迎提示 */
    .welcome-message {
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      padding: 3rem 2rem;
      border-radius: 20px;
      margin: 1.5rem auto;
      max-width: 600px;
      text-align: center;
    }
    .welcome-message h2 {
      color: #667eea;
      font-size: 1.8rem;
      margin-bottom: 1rem;
    }
    .welcome-message p {
      color: #555;
      font-size: 1.1rem;
      line-height: 1.6;
    }
  </style>

    // 获取所有物品的平铺数组（用于兼容性）
    function getAllItems() {
      const allItems = [];
      for (const category in itemsLibrary) {
        allItems.push(...itemsLibrary[category]);
      }
      return allItems;
    }

    // 根据物品查找其所属类别
    function getCategoryForItem(item) {
      for (const category in itemsLibrary) {
        if (itemsLibrary[category].some(i => i.emoji === item.emoji)) {
          return category;
        }
      }
      return null;
    }

    // 难度配置（增加更多难度等级）
    const levelConfigs = {
      level1: { name: '1级 - 入门', totalItems: 20, targetCount: 3, sameCategoryRatio: 0.5, distractorTypes: 6 },
      level2: { name: '2级 - 简单', totalItems: 30, targetCount: 3, sameCategoryRatio: 0.6, distractorTypes: 8 },
      level3: { name: '3级 - 普通', totalItems: 40, targetCount: 4, sameCategoryRatio: 0.65, distractorTypes: 10 },
      level4: { name: '4级 - 中等', totalItems: 50, targetCount: 4, sameCategoryRatio: 0.7, distractorTypes: 12 },
      level5: { name: '5级 - 困难', totalItems: 60, targetCount: 5, sameCategoryRatio: 0.75, distractorTypes: 14 },
      level6: { name: '6级 - 很难', totalItems: 70, targetCount: 5, sameCategoryRatio: 0.8, distractorTypes: 16 },
      level7: { name: '7级 - 专家', totalItems: 80, targetCount: 6, sameCategoryRatio: 0.85, distractorTypes: 18 },
      level8: { name: '8级 - 大师', totalItems: 100, targetCount: 7, sameCategoryRatio: 0.9, distractorTypes: 20 }
    };

    // 初始化游戏（准备阶段，不计入轮次）
    function prepareGame() {
      const config = levelConfigs[level];
      const container = document.getElementById('grid');
      container.innerHTML = '';

      items = [];
      foundCount = 0;
      targetCount = config.targetCount;

      // 随机选择目标物品（从所有物品中选择）
      const allItems = getAllItems();
      const targetItem = allItems[Math.floor(Math.random() * allItems.length)];
      targetEmoji = targetItem.emoji;
      targetName = targetItem.name;

      // 找到目标物品的类别
      const targetCategory = getCategoryForItem(targetItem);

      // 获取同类别的其他物品（不包含目标物品本身）
      const sameCategoryItems = itemsLibrary[targetCategory].filter(
        item => item.emoji !== targetEmoji
      );

      // 获取其他类别的所有物品
      const otherCategoryItems = [];
      for (const category in itemsLibrary) {
        if (category !== targetCategory) {
          otherCategoryItems.push(...itemsLibrary[category]);
        }
      }

      // 根据难度配置，计算同类别干扰物品和其他类别干扰物品的数量
      const sameCategoryCount = Math.floor(config.distractorTypes * config.sameCategoryRatio);
      const otherCategoryCount = config.distractorTypes - sameCategoryCount;

      // 选择干扰物品：优先同类别
      const distractorItems = [];

      // 添加同类别干扰物品
      const selectedSameCategory = sameCategoryItems
        .sort(() => Math.random() - 0.5)
        .slice(0, Math.min(sameCategoryCount, sameCategoryItems.length));
      distractorItems.push(...selectedSameCategory);

      // 添加其他类别干扰物品
      const selectedOtherCategory = otherCategoryItems
        .sort(() => Math.random() - 0.5)
        .slice(0, otherCategoryCount);
      distractorItems.push(...selectedOtherCategory);

      // 生成物品数组：目标物品 + 干扰物品
      const itemsToPlace = [];
      // 添加目标物品
      for (let i = 0; i < config.targetCount; i++) {
        itemsToPlace.push({ ...targetItem, isTarget: true });
      }
      // 添加干扰物品，填满剩余位置
      const remainingSlots = config.totalItems - config.targetCount;
      for (let i = 0; i < remainingSlots; i++) {
        const distractor = distractorItems[Math.floor(Math.random() * distractorItems.length)];
        itemsToPlace.push({ ...distractor, isTarget: false });
      }

      // 随机打乱物品位置
      itemsToPlace.sort(() => Math.random() - 0.5);

      // 用于记录已占用的位置，避免重叠
      const occupiedPositions = [];
      const minDistance = 8; // 最小间距（百分比单位，相对于容器宽度）

      // 创建物品并随机放置
      itemsToPlace.forEach((item, index) => {
        const cell = document.createElement('div');
        cell.className = 'item-cell';
        cell.textContent = item.emoji;
        cell.dataset.index = index;
        cell.dataset.isTarget = item.isTarget;
        cell.onclick = () => clickItem(index);

        // 随机位置，确保不重叠
        let x, y, attempts = 0;
        let validPosition = false;

        while (!validPosition && attempts < 200) {
          x = Math.random() * 90; // 0-90% (留出物品大小的空间)
          y = Math.random() * 90;

          // 检查是否与已有物品重叠
          validPosition = true;
          for (const pos of occupiedPositions) {
            const distance = Math.sqrt(Math.pow(x - pos.x, 2) + Math.pow(y - pos.y, 2));
            if (distance < minDistance) {
              validPosition = false;
              break;
            }
          }
          attempts++;
        }

        // 如果找不到不重叠的位置，尝试在边缘区域放置
        if (!validPosition) {
          x = Math.random() * 90;
          y = Math.random() * 90;
        }

        occupiedPositions.push({ x, y });

        cell.style.left = x + '%';
        cell.style.top = y + '%';

        container.appendChild(cell);
        items.push({
          emoji: item.emoji,
          name: item.name,
          isTarget: item.isTarget,
          element: cell,
          found: false
        });
      });

      // 更新任务提示
      document.getElementById('targetEmoji').textContent = targetEmoji;
      document.getElementById('targetName').textContent = targetName;
      document.getElementById('targetCount').textContent = targetCount;

      updatePanel();
      document.getElementById('msg').textContent = '';
      document.getElementById('msg').classList.remove('error');

      // 隐藏欢迎消息，显示游戏区域和任务提示
      document.getElementById('welcomeMessage').style.display = 'none';
      document.getElementById('taskPrompt').style.display = 'flex';
      document.getElementById('grid').style.display = 'block';
      document.getElementById('stats').style.display = 'block';
    }

    // 开始游戏（点击开始按钮后调用，此时才计入轮次）
    async function startGame() {
      if (gameStarted) return;

      gameStarted = true;
      document.getElementById('startBtn').style.display = 'none'; // 隐藏按钮而不是禁用

      // 准备游戏界面
      prepareGame();

      // 开始新轮次记录
      roundNumber++;
      roundStartTime = Date.now();
      console.log('🔵 [火眼金睛] 开始新轮次', { sessionId, roundNumber, level });
      try {
        // 上报当前等级
        const levelForm = new URLSearchParams();
        levelForm.set('session_id', sessionId);
        levelForm.set('level', level);
        await fetch('/api/session/update-level', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: levelForm
        });

        const form = new URLSearchParams();
        form.set('session_id', sessionId);
        form.set('round_number', roundNumber);
        const response = await fetch('/api/session/round/start', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: form
        });
        const data = await response.json();
        currentRoundId = data.round_id;
        console.log('✅ [火眼金睛] 轮次开始成功', { roundId: currentRoundId });
      } catch (err) {
        console.error('❌ [火眼金睛] 开始轮次失败:', err);
      }

      // 开始计时
      startTimer();
    }

    // 点击物品
    function clickItem(index) {
      if (!gameStarted) return; // 游戏未开始，不响应点击

      const item = items[index];
      if (item.found) return; // 已找到的不能再点

      if (item.isTarget) {
        // 找到目标物品
        item.element.classList.add('found');
        item.found = true;
        foundCount++;
        successCount++;

        updatePanel();

        // 检查是否全部找到
        if (foundCount === targetCount) {
          finish();
        } else {
          showMessage(`太棒了！还需要找到 ${targetCount - foundCount} 个`, false);
        }
      } else {
        // 点错了
        item.element.classList.add('wrong');
        errorCount++;

        updatePanel();
        showMessage('不对哦，再仔细看看！', true);

        setTimeout(() => {
          item.element.classList.remove('wrong');
        }, 300);
      }
    }

    // 显示消息
    function showMessage(text, isError) {
      const msgEl = document.getElementById('msg');
      msgEl.textContent = text;
      if (isError) {
        msgEl.classList.add('error');
      } else {
        msgEl.classList.remove('error');
      }
    }

    // 更新面板显示
    function updatePanel() {
      document.getElementById('found').textContent = foundCount;
      document.getElementById('total').textContent = targetCount;
      document.getElementById('err').textContent = errorCount;
    }

    // 开始计时
    function startTimer() {
      startTs = Date.now();
      tick();
      clearInterval(window._t);
      window._t = setInterval(tick, 500);
    }

    // 更新计时
    function tick() {
      const secs = Math.floor((Date.now() - startTs) / 1000);
      document.getElementById('elapsed').textContent = secs + ' 秒';
    }

    // 游戏完成
    async function finish() {
      clearInterval(window._t);
      const secs = Math.floor((Date.now() - startTs) / 1000);
      const accuracy = Math.round((successCount / (successCount + errorCount)) * 100);
      showMessage(`恭喜！全部找到了！用时 ${secs} 秒，正确率 ${accuracy}%`, false);

      // 记录轮次完成
      await finishRound(secs, accuracy);
    }

    // 记录轮次完成
    async function finishRound(secs, accuracy) {
      console.log('🔵 [火眼金睛] 准备记录轮次完成', { roundId: currentRoundId, secs, accuracy, errors: errorCount });
      if (!currentRoundId) {
        console.warn('⚠️ [火眼金睛] 没有currentRoundId，跳过轮次记录');
        return;
      }

      const config = levelConfigs[level];
      const score = Math.max(0, 100 - errorCount * 5); // 每个错误扣5分

      // 构建metadata JSON
      const metadata = JSON.stringify({
        level: level,
        total_items: config.totalItems,
        target_count: targetCount,
        target_name: targetName,
        target_emoji: targetEmoji,
        time_seconds: secs,
        success_count: successCount,
        error_count: errorCount
      });

      console.log('🔵 [火眼金睛] 发送轮次完成请求', { score, accuracy, duration: secs });
      try {
        const form = new URLSearchParams();
        form.set('round_id', currentRoundId);
        form.set('duration_seconds', secs); // 使用前端计算的准确时长
        form.set('success', errorCount === 0 ? '1' : '0');
        form.set('score', score);
        form.set('accuracy', accuracy);
        form.set('metadata', metadata);

        const response = await fetch('/api/session/round/finish', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: form
        });
        const data = await response.json();
        console.log('✅ [火眼金睛] 轮次记录完成', data);
      } catch (err) {
        console.error('❌ [火眼金睛] 记录轮次失败:', err);
      }
    }

    // 改变难度
    function changeLevel() {
      const selector = document.getElementById('levelSelector');
      level = selector.value;

      // 如果游戏已开始，重置游戏状态
      if (gameStarted) {
        gameStarted = false;
        document.getElementById('startBtn').style.display = 'inline-block';
        document.getElementById('startBtn').textContent = '开始游戏';
        clearInterval(window._t);

        // 显示欢迎消息
        document.getElementById('welcomeMessage').style.display = 'block';
        document.getElementById('taskPrompt').style.display = 'none';
        document.getElementById('grid').style.display = 'none';
        document.getElementById('stats').style.display = 'none';
      }
    }

    // 重新开始游戏
    async function restartGame() {
      // 如果有正在进行的轮次，先结束它
      if (currentRoundId && gameStarted) {
        await finishRound(Math.floor((Date.now() - startTs) / 1000), 0);
      }

      clearInterval(window._t);
      gameStarted = false;
      successCount = 0;
      errorCount = 0;

      document.getElementById('startBtn').style.display = 'inline-block';
      document.getElementById('startBtn').textContent = '开始游戏';

      // 显示欢迎消息
      document.getElementById('welcomeMessage').style.display = 'block';
      document.getElementById('taskPrompt').style.display = 'none';
      document.getElementById('grid').style.display = 'none';
      document.getElementById('stats').style.display = 'none';
      document.getElementById('msg').textContent = '';
    }

    // 页面加载完成后初始化
    document.addEventListener('DOMContentLoaded', () => {
      // 默认显示欢迎消息
      document.getElementById('welcomeMessage').style.display = 'block';
      document.getElementById('taskPrompt').style.display = 'none';
      document.getElementById('grid').style.display = 'none';
      document.getElementById('stats').style.display = 'none';
    });
  </script>
</head>
<body>
  <header>
    <h1>火眼金睛 👀</h1>
    <nav>
      <a href="/">首页</a>
    </nav>
  </header>
  <section class="panel">
    <p class="big">快速找出所有目标物品！</p>
    <p class="instruction">在众多物品中找出指定的目标，训练你的观察力和专注力</p>

    <!-- 欢迎消息 -->
    <div id="welcomeMessage" class="welcome-message">
      <h2>👀 准备好挑战你的火眼金睛了吗？</h2>
      <p>选择难度等级，然后点击"开始游戏"按钮开始训练！</p>
      <p style="color: #999; font-size: 0.95rem; margin-top: 1rem;">越高的难度，干扰物品与目标物品越相似</p>
    </div>

    <!-- 难度选择 -->
    <div class="controls">
      <label for="levelSelector" style="font-weight: 600; color: #333; font-size: 1rem;">🎯 难度等级：</label>
      <select id="levelSelector" class="levelSelector" onchange="changeLevel()">
        <option value="level1">1级 - 入门 (20个物品，找3个)</option>
        <option value="level2">2级 - 简单 (30个物品，找3个)</option>
        <option value="level3">3级 - 普通 (40个物品，找4个)</option>
        <option value="level4" selected>4级 - 中等 (50个物品，找4个)</option>
        <option value="level5">5级 - 困难 (60个物品，找5个)</option>
        <option value="level6">6级 - 很难 (70个物品，找5个)</option>
        <option value="level7">7级 - 专家 (80个物品，找6个)</option>
        <option value="level8">8级 - 大师 (100个物品，找7个)</option>
      </select>
    </div>

    <!-- 开始按钮 -->
    <button id="startBtn" class="start-btn" onclick="startGame()">开始游戏</button>

    <!-- 任务提示 - 精简版 -->
    <div id="taskPrompt" class="task-prompt" style="display: none;">
      <span style="font-size: 1rem; opacity: 0.9;">请找出：</span>
      <span id="targetEmoji" class="target">🧦</span>
      <span id="targetName" class="info">袜子</span>
      <span class="info">×<span id="targetCount">3</span></span>
    </div>

    <!-- 信息栏 -->
    <div id="stats" class="info-bar" style="display: none;">
      <div class="info-item">
        <span class="info-label">⏱️ 计时</span>
        <span class="info-value timer" id="elapsed">0 秒</span>
      </div>
      <div class="info-item">
        <span class="info-label">🎯 已找到</span>
        <span class="info-value"><span id="found">0</span>/<span id="total">3</span></span>
      </div>
      <div class="info-item">
        <span class="info-label">❌ 错误</span>
        <span class="info-value" id="err">0</span>
      </div>
    </div>

    <div id="grid" class="items-container" style="display: none;"></div>

    <p id="msg"></p>

    <div style="margin-top:1.5rem;">
      <button onclick="restartGame()" style="background:#667eea; margin-right: 0.5rem;">重新开始</button>
      <form action="/session/finish" method="post" style="display:inline">
        <input type="hidden" name="id" value="{{.ID}}" />
        <button type="submit" style="background:#4ab3e2">结束训练</button>
      </form>
    </div>
  </section>
</body>
</html>
